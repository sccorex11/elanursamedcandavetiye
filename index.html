<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elanur & Samed Can - Düğün Davetiyesi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0d0d;
        font-family: 'Playfair Display', serif;
    }
    iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
    }

    #envelope-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #090909;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .envelope-wrapper {
        text-align: center;
        cursor: pointer;
    }

    .envelope {
        position: relative;
        width: 280px;
        height: 180px;
        background: #1f1f1f;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        margin: 0 auto 25px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.4s ease;
    }

    .envelope-wrapper:hover .envelope {
        transform: scale(1.03);
    }

    .envelope-flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-left: 140px solid transparent;
        border-right: 140px solid transparent;
        border-top: 100px solid #2a2a2a;
        transform-origin: top;
        transition: transform 0.6s ease-in-out;
        z-index: 3;
    }

    .envelope-wrapper.open .envelope-flap {
        transform: rotateX(180deg);
        z-index: 1;
    }

    .envelope-seal {
        position: relative;
        z-index: 4;
        font-family: 'Cinzel', serif;
        font-size: 20px;
        letter-spacing: 2px;
        color: #e0e0e0;
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 10px 18px;
        border-radius: 50px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        transition: opacity 0.3s ease;
    }

    .envelope-wrapper.open .envelope-seal {
        opacity: 0;
    }

    .open-text {
        font-family: 'Cinzel', serif;
        font-size: 16px;
        letter-spacing: 3px;
        color: #f0f0f0;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 12px 25px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.03);
        display: inline-block;
        transition: all 0.3s ease;
    }

    .envelope-wrapper:hover .open-text {
        background: rgba(255, 255, 255, 0.1);
        border-color: #e0e0e0;
    }

    .assets-load {
        display: none;
    }
</style>
</head>
<body>

    <div id="envelope-overlay">
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
            <div class="envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-seal">E & S</div>
            </div>
            <div class="open-text">Davetiyeyi Aç</div>
        </div>
    </div>

    <iframe src="https://elanurcan-bcncyhiz.manus.space/" title="Elanur & Samed Can Davetiye" allow="autoplay; fullscreen"></iframe>

    <div class="assets-load">
        <img src="11.jpeg" alt="Fotoğraf 1">
        <img src="12.jpeg" alt="Fotoğraf 2">
    </div>

    <script>
        function openEnvelope() {
            const wrapper = document.getElementById('envelopeWrapper');
            wrapper.classList.add('open');

            setTimeout(() => {
                const overlay = document.getElementById('envelope-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }, 600);
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            iframe.addEventListener('load', () => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const links = iframeDoc.querySelectorAll('a');
                    links.forEach(link => {
                        if (link.href && link.href.includes('google.com/maps')) {
                            link.href = 'https://maps.app.goo.gl/tAAu1rCNQib11LgP6';
                        }
                    });
                } catch (e) {}
            });
        });
    </script>
</body>
</html>
